name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guard - torch must not leak into the default install
        run: python -c "import importlib.util, sys; leaked = importlib.util.find_spec('torch') is not None; print('torch installed:', leaked); sys.exit(1 if leaked else 0)"

      - name: Syntax check
        run: python -m compileall -q app.py src sentiment_analysis tests

      - name: Run unit tests
        run: python -m unittest discover tests -v
