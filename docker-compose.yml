# docker-compose：一键拉起 api + mysql + redis。
#
# 面试必问：api 为什么等 MySQL 健康再起？（容器启动顺序 ≠ 服务就绪顺序）
#
# `depends_on` 默认只保证「mysql 容器先于 api 容器启动」，但 MySQL 容器「启动」
# 只是进程起来了，此时它可能还在做初始化（建数据目录、跑 init 脚本、监听端口），
# api 这时去连会报「connection refused」。所以不能只写 depends_on，还要：
#   1. mysql 服务配 healthcheck（用 mysqladmin ping 探测真正就绪）；
#   2. api 的 depends_on 用 condition: service_healthy —— 等 mysql 的健康检查
#      通过后才启动 api。
# 这样「启动顺序」才真正变成「就绪顺序」。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # 密码用环境变量注入（.env 提供），不把真实凭据写死进 compose 文件。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: chatbot
    # 显式指定服务端默认字符集与排序规则，和练习库 / ORM 对齐
    # （utf8mb4 才能存 4 字节字符，也就是 emoji —— utf8 在 MySQL 里只到 3 字节）。
    #
    # ⚠️ 不要用 environment 里的 MYSQL_CHARSET / MYSQL_COLLATION：那不是 mysql 官方镜像
    # 支持的变量，写了不报错、只是被静默忽略，属于「看起来配了其实没配」。
    # 官方文档给的机制是：命令行末尾的 mysqld 参数会被原样透传。
    # command 只覆盖镜像的 CMD，entrypoint（docker-entrypoint.sh）照常执行。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # 故意不把 3306 映射到宿主机（公网上就是「给全世界开了一个数据库端口」）。
    # 容器之间走 compose 内网服务名互访，根本不需要宿主机端口。
    # 需要在服务器上手工连库调试时用：
    #   docker compose exec mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" chatbot
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping 返回 0 表示 MySQL 真正能接受连接了。
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 同样不映射端口：Redis 默认无密码，暴露到公网等于把数据交出去
    # （历史上大量 Redis 被写 SSH key / 挖矿就是这么来的）。
    # 调试用：docker compose exec redis redis-cli
    healthcheck:
      # Redis 起得很快，但"容器已启动"和"能接受命令"仍是两件事。
      # 给它一个健康检查，api 才能用 service_healthy 等它真就绪。
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      # 透传 pip 源给 Dockerfile 的 ARG。默认官方 PyPI（和 Dockerfile 的默认值一致）；
      # 在 .env 里写一行 PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
      # 就能把那一层从数小时压到两分钟 —— 实测见 Dockerfile 里的注释。
      # 注意 compose 的 .env 只负责**文件内插值**，不会自动注入容器环境；
      # 但 build.args 走的正是插值这条路，所以这里能生效。
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    environment:
      # 容器内通过服务名 mysql / redis 互相访问（compose 自建网络 + DNS）。
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-change-me}@mysql:3306/chatbot?charset=utf8mb4"
      # ⚠️ 必须显式给 REDIS_URL。cache.py 的默认值是 127.0.0.1:6379，而在容器里
      # 127.0.0.1 指的是 api 容器自己 —— Redis 在另一个容器，用服务名 redis 才能解析。
      # 少了这一行不会报错，只会静默降级成「永远不缓存」，是个很难发现的坑。
      REDIS_URL: "redis://redis:6379/0"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-120}"
      # 生成参数的透传。src/config.py 会读这三个变量，但 compose 的 .env 只用于
      # 「compose 文件内部的变量插值」，**不会自动注入容器环境**。少了这三行，
      # 在 .env 里调 TEMPERATURE 完全没效果 —— 又一处静默失效的配置。
      TEMPERATURE: "${TEMPERATURE:-0.7}"
      TOP_P: "${TOP_P:-0.9}"
      MAX_TOKENS: "${MAX_TOKENS:-2048}"
    # Linux 上 host.docker.internal 不会自动解析 —— Docker Desktop for Mac/Windows
    # 才自带这个别名，Linux 原生 Docker 是"显式 opt-in"的设计差异，不是配置写错。
    # 缺了这段，容器里求 OLLAMA_BASE_URL 会直接
    # `Name or service not known`，聊天功能整体不可用。
    # host-gateway 是 Docker 20.10+ 的特殊值，运行时替换为宿主机网关 IP。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 只暴露 API。端口可用 .env 里的 API_PORT 覆盖（默认 8000）。
      #
      # API_BIND 是**绑定地址**，默认 0.0.0.0（所有网卡）。
      # 启用反代时（`--profile proxy` / `deploy.sh --proxy`）应当改成 127.0.0.1：
      # 否则外面可以绕过反代直连 8000，HTTPS / 限流 / SSE 防缓冲那一层就白配了。
      # 这一条由 `deploy.sh --proxy` 提前拦住，不靠人记得改。
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # api 启动后自动执行建表脚本，再起服务。
    command: >
      sh -c "python -m db.init_db && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # 探 /health（liveness）而不是 /health/ready（readiness）：
      # docker 的 healthcheck 语义是「这个容器还正常吗」，依赖全不通时重启容器也没用，
      # 反而会陷入 restart 循环。readiness 交给外层的编排/负载均衡去判断。
      #
      # 注意 python:3.11-slim 里没有 curl/wget（精简掉了），所以用 python 一行发请求，
      # 不为一个探针去装额外工具。
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── 可选的反向代理入口（HTTP）────────────────────────────────────
  # 默认**不启动**：`profiles` 里的服务只在显式启用时才参与。
  #   只用 API：        docker compose up -d
  #   连反代一起起：    docker compose --profile proxy up -d
  #
  # 为什么不放在默认启动里：多数本地开发不需要它，而一旦默认起，就会多占 80 端口、
  # 多拉一个镜像，还会让「直连 8000」和「经 80」两条路径在排查时混在一起。
  # 上线时建议启用（见 docs/DEPLOY.md §6），因为 HTTPS、限流、真实 IP 都要在这一层做。
  #
  # 明文还是 HTTPS 不是「换一份 compose」，而是「换一个配置源」：
  #   .env 里 NGINX_TEMPLATES_DIR=./deploy/nginx/tls → 用 HTTPS 那份模板（见 §6.2）
  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      # 这四个名字 = 模板里的占位符。nginx 官方镜像启动时会跑
      # docker-entrypoint.d/20-envsubst-on-templates.sh，把 /etc/nginx/templates 下
      # `*.template` 的占位符换成**容器环境变量**，渲染到 /etc/nginx/conf.d/ —— 所以
      # **配置的单一来源是仓库里那两个模板**，服务器上不需要手写 nginx.conf
      # （手写的会在某次 git pull 后与仓库漂移，而且没有任何东西会提醒你）。
      #
      # envsubst 只替换「环境里真实存在的变量」，所以多传一个变量是安全的：
      # 明文那份模板里没有 ${LISTEN_TLS_PORT}，它对此毫无反应。
      #
      # 非 ASCII 域名不用管（nginx 的 server_name 本来就写 punycode）；
      # 默认 `_` 是 catch-all，用 IP 直接访问也能命中。
      SERVER_NAME: "${SERVER_NAME:-_}"
      # 容器之间走 compose 内网服务名，不经过宿主机端口
      API_UPSTREAM: "api:8000"
      LISTEN_PORT: "${PROXY_HTTP_PORT:-80}"
      # 只有 deploy/nginx/tls 那份模板用得到（HTTPS 的监听端口）
      LISTEN_TLS_PORT: "${PROXY_HTTPS_PORT:-443}"
    volumes:
      # 配置源可切换：默认是明文那份；指到 deploy/nginx/tls 就是 HTTPS（见 §6.2）。
      # 挂载点固定为 /etc/nginx/templates —— 那是官方镜像 envsubst 的约定位置，
      # 挂到别处它不会处理（结果是容器起来后服务的是镜像自带的默认站点，很难查）。
      - ${NGINX_TEMPLATES_DIR:-./deploy/nginx/templates}:/etc/nginx/templates:ro
      # 证书目录。明文模式下没人读它；HTTPS 模式下模板从这里读 fullchain.pem /
      # privkey.pem。**私钥不进仓库**：这里只挂载，且 .gitignore 挡着。
      - ${TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    ports:
      # 宿主机端口与容器内监听端口取同一个值（LISTEN_PORT 上面也是它），少一个概念。
      - "${PROXY_HTTP_PORT:-80}:${PROXY_HTTP_PORT:-80}"
      # 443 一直在映射列表里，即使明文模式下容器里没人在听它（连上去是 connection
      # refused）。compose 没法按 profile 条件化 ports，而为了这个再复制一个近似的
      # 服务会更糟：两份编排迟早漂移。代价是「没在用的端口也被 docker-proxy 占着」。
      - "${PROXY_HTTPS_PORT:-443}:${PROXY_HTTPS_PORT:-443}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx:alpine 是 busybox 基础镜像，自带 wget（不必为了一个探针再装 curl）。
      #
      # 两种部署形态都要探得到，所以是「先明文、不行再 HTTPS」：
      # 明文模式下第一个就够；HTTPS 模式下 80 只回 301（busybox wget 会跟到 https，
      # 而容器里没有可信 CA —— 自签或内网证书都会失败），于是落到第二个。
      # 那里加 --no-check-certificate 只作用在**这一根探针**上，不影响对外提供 TLS。
      # 让探针去适配部署形态，好过为一根探针在线上配置里开一个明文例外。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PROXY_HTTP_PORT:-80}/health || wget -qO- --no-check-certificate https://127.0.0.1:${PROXY_HTTPS_PORT:-443}/health"]

volumes:
  mysql_data:
